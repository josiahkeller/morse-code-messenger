<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Morse Code Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="disconnected-banner">Connecting…</div>

  <header>
    <h1>Morse Code Messenger</h1>
    <div class="user-count">
      <span id="others-count">0</span> others connected
    </div>
  </header>

  <main>
    <div id="settings">
      <label>
        <input type="checkbox" id="mute-audio">
        Mute audio
      </label>
      <label id="vibrate-label">
        <input type="checkbox" id="enable-vibrate">
        Vibrate
      </label>
    </div>

    <div class="display-wrapper">
      <canvas id="display"></canvas>
    </div>

    <button id="transmit" disabled aria-label="Hold to transmit">
      Hold to Transmit
      <span id="spacebar-hint"> or hold Space</span>
    </button>
  </main>

  <script src="app.js"></script>
</body>
</html>
